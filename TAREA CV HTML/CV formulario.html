<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <form action="">

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="escriba su nombre">
        </p>

        <p>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" placeholder="escriba su apellido">
        </p>

        <p>
            <label for="sexo">Sexo:</label>
        </p>
        <ul>
            <li>
                <input type="radio" name="sexo" value="hombre">
                <label>Hombre</label>
            </li>
            <li>
                <input type="radio" name="sexo" value="mujer">
                <label>Mujer</label>
            </li>
            <li>
                <input type="radio" name="sexo" value="otro">
                <label>Otro</label>
            </li>
        </ul>
        <label>Hobbies:</label>
        <ul>
            <li>
                <input type="checkbox" name="hobbies" [] value="bailar" id="bailar">
                <label for="bailar">Bailar</label>
            </li>
            <li>
                <input type="checkbox" name="hobbies" [] value="tocar un instrumento" id="tocar un instrumento">
                <label for="tocar un instrumento">Tocar un instrumento</label>
                <input type="text" id="tocar un instrumento" name="tocar un instrumento"
                    placeholder="¿cúal instrumento?">
            </li>
            <li>
                <input type="checkbox" name="hobbies" [] value="ir al gimnasio" id="ir al gimnasio">
                <label for="ir al gimnasio">Ir al gimnasio</label>
            </li>
            <li>
                <input type="checkbox" name="hobbies" [] value="jugar videojuegos" id="jugar a videojuegos">
                <label for="jugar a videojuegos">Jugar a videojuegos</label>
            </li>
            <li>
                <input type="radio" name="otro" value="otro">
                <label for="hobbies">Otro</label>
                <input type="text" placeholder="¿cúal?">
            </li>
        </ul>
        <p>
            <label for="titulo">Titulo:</label>
            <select name="titulo">
                <option value="primario">Primario</option>
                <option value="secundario">secundario</option>
                <option value="terciario">Terciario</option>
                <option value="universitario">Universitario</option>
            </select>
        </p>
        <p>
            <label for="comentarios">Comentarios</label>
            <textarea name="comentarios"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Borrar">
        </p>


    </form>

</body>

</html>
